spring.application.name=gestor-gimnasio

# Puerto del servidor: la API queda en http://localhost:8080
server.port=8080

# Datos de conexión MySQL (la base gimnasio_db se crea sola si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/gimnasio_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# update = Hibernate crea / actualiza las tablas a partir de las entidades (@Entity)
spring.jpa.hibernate.ddl-auto=update

# true = muestra en consola el SQL que ejecuta Hibernate (útil para la defensa)
spring.jpa.show-sql=true
